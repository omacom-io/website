  <style>
    :root {
      --rgb-background-night: 26, 27, 38;
      --rgb-black: 0, 0, 0;
      --rgb-terminal-blue: 122, 162, 247;
      --rgb-turquoise: 180, 249, 248;

      --color-background-night: rgb(var(--rgb-background-night));
      --color-terminal-blue: rgb(var(--rgb-terminal-blue));
      --color-turquoise: rgb(var(--rgb-turquoise));

      --transition: 0.15s cubic-bezier(0.33, 1, 0.68, 1);
    }
    html, body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Cascadia Code', Menlo, Monaco, Consolas, 'Courier New', monospace;
    }
    a {
      color: #ffffff;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 2rem;
    }
    img {
      max-width: 500px;
      display: block;
      margin-bottom: -8rem;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 400;
      text-align: center;
      margin: 0 0 3rem;
    }
    .nav {
      display: flex;
      flex-direction: column;
      gap: 1em;
      align-items: center;
      padding-inline: 2em;
      margin-bottom: 2rem;
    }
    .nav__row {
      display: flex;
      flex-wrap: wrap;
      gap: 1em;
      justify-content: center;
    }
    .button {
      align-items: center;
      background: #ec4dc7;
      border: none;
      border-radius: 0.4em;
      box-shadow:
        0 1px 0 0 rgba(var(--rgb-black), 0.1),
        0 0.2em 1.2em -0.4em rgba(var(--rgb-black), 0.2),
        0 0.4em 2.0em -0.8em rgba(var(--rgb-black), 0.3),
        0 0.4em 0.4em -0.8em rgba(var(--rgb-black), 0.4),
        0 0.8em 0.8em -1.2em rgba(var(--rgb-black), 0.5),
        0 1.2em 1.2em -1.6em rgba(var(--rgb-black), 0.6);
      color: #1a1b26;
      cursor: pointer;
      display: flex;
      font-weight: 700;
      gap: 1ch;
      height: 2.9em;
      line-height: 1;
      padding-inline: 1em;
      text-decoration: none;
      text-transform: uppercase;
      transition:
        background var(--transition),
        color var(--transition);
    }
    .button svg {
      height: 1.4em;
      overflow: visible;
      width: 1.4em;
    }
    @media(hover: hover) {
      .button:hover {
        background: #f97ad9;
        color: #1a1b26;
      }
    }
  </style>
</head>
